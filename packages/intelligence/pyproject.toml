[tool.poetry]
name = "cryonix-intelligence"
version = "0.2.0"
description = "ORAKEL Forecast Engine — ML-driven market prediction and signal fusion"
authors = ["Cryonix Team"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
redis = "^5.0.1"
ccxt = "^4.2.0"
xgboost = ">=2.0"
hmmlearn = ">=0.3"
arch = ">=6.0"
filterpy = ">=1.4"
scikit-learn = ">=1.4"
pandas = ">=2.0"
numpy = ">=1.24"
tomlkit = ">=0.12"
httpx = "^0.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
