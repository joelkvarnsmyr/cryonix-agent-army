[tool.poetry]
name = "cryonix-intelligence"
version = "0.1.0"
description = "Python Intelligence Layer for Cryonix Trading System"
authors = ["Cryonix Team"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
python-dotenv = "^1.0.0"
dspy-ai = "^2.0.0"
langgraph = "^0.0.10"
httpx = "^0.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
