[broker]
paper_trading = true
exchange = "binance"
# Paper wallet: virtual $1000 USDC starting capital
initial_balance_usd = 1000

[signals]
# Signal sources to aggregate (Redis keys)
# Each source produces σᵢ ∈ [-1,+1] directional signals
sources = [
    "smartmoney",      # Copynix whale BUY/SELL sentiment
    "polymarket",      # Prediction market scores (fed, geo, oil, crypto)
    "fear_greed",      # CoinMarketCap Fear & Greed index
    "cryonix_ta",      # Technical analysis patterns from Python engine
]
# Minimum signals needed for Ψ computation (lowered: 2 independent sources enough)
min_signals = 2

[psi]
# Kuramoto phase transition threshold — C above this = synchronized
phase_transition_threshold = 0.6
# Kelly fraction cap — never risk more than this
kelly_fraction_cap = 0.25
# Shannon entropy bins for market temperature
entropy_bins = 10
# Entropy floor (prevents division by zero)
entropy_floor = 0.1
# Beta scale factor: β = beta_scale / H (research optimal = 3.0, most sensitive param)
beta_scale = 3.0

[trading]
# Only trade when Ψ magnitude exceeds this threshold (lowered for more trades)
min_psi_magnitude = 0.03
# Maximum position size in USD (sweep: $600 optimal for PnL)
max_position_size_usd = 500
# Maximum concurrent positions
max_positions = 4
# Symbols to trade (Binance USDC pairs)
symbols = ["BTC/USDC", "ETH/USDC", "SOL/USDC", "BNB/USDC"]

[exits]
take_profit_pct = 5.0
stop_loss_pct = 3.0
trailing_stop_pct = 2.0
trailing_activation_pct = 2.5

[risk]
# Binance fee per side (0.1% standard, 0.075% with BNB discount)
fee_pct = 0.1
# Minimum expected edge after round-trip fees to enter a trade (%)
# Lowered: fee formula now uses coherence C (realistic) not |Ψ| (underestimate)
min_edge_after_fees = 0.05
# Consecutive losses before circuit breaker halts trading
circuit_breaker_losses = 4
# Cooldown after circuit breaker (ms) — 1 hour
circuit_breaker_cooldown_ms = 3600000
# Halve position size when drawdown exceeds this %
drawdown_halflife_pct = 5.0
# Stop trading entirely at this drawdown %
max_drawdown_halt_pct = 15.0
# Minimum bars to hold a position (anti-churn, prevents fee-burning)
min_hold_bars = 3
# If rolling profit factor drops below this, halve positions
profit_factor_gate = 0.8
# Number of recent trades for dynamic Kelly + profit factor calculation
rolling_window = 30
# Per-symbol cooldown after exit (ms) — prevents re-entry churn (30 min)
post_exit_cooldown_ms = 1800000
# Minimum |weightedSignal| to enter — filters weak entries like BTC LONG at 0.074
min_weighted_signal = 0.15

[equity]
# Finnhub API key (free tier, 60 calls/min). Empty = equity signals disabled.
finnhub_api_key = ""
# Poll interval for SPY/QQQ/UUP quotes (ms) — 5 minutes
poll_interval_ms = 300000

[timing]
# Main loop interval (how often to compute Ψ)
poll_interval_ms = 60000
# Price update interval
price_update_ms = 30000
