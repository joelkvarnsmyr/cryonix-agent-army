[broker]
paper_trading = true
clob_api_url = "https://clob.polymarket.com"
gamma_api_url = "https://gamma-api.polymarket.com"

[capital]
starting_balance_usd = 1475
max_bet_size_usd = 25
max_concurrent_positions = 40
max_exposure_pct = 95

[strategy]
arb_threshold = 0.93            # Require 7% gross edge (was 0.96 = 4%) → ~3% net after fees
min_edge_pct = 2.0
momentum_lookback_seconds = 60
min_time_to_expiry_s = 300         # 5 min minimum (allow short-duration bets)
max_time_to_expiry_s = 1209600     # 14 days max (faster settlement = more data)
scan_all_for_arb = true            # Scan all high-liquidity markets for YES+NO arb
min_liquidity_usd = 200            # Min $200 liquidity (was 500 — include more markets)
max_markets_per_scan = 150         # Max markets per arb scan cycle (was 80)

[risk]
kelly_fraction = 0.25
max_daily_loss_usd = 25
max_consecutive_losses = 5
fee_rate = 0.0156

[timing]
scan_interval_ms = 30000           # 30s between scans (was 60s — faster discovery)
settlement_check_ms = 300000       # 5 min settlement checks

[micro_markets]
enabled = true
min_time_to_expiry_s = 30          # 30s minimum (need time to execute)
max_time_to_expiry_s = 300         # 5 minutes max
max_bet_size_usd = 9               # $9 per micro-bet (small, high frequency)
reserve_pct = 20                   # 20% of bankroll reserved for micro-markets only

[data_sources]
binance_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
use_polymarket_intelligence = true
