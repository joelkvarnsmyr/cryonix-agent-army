[broker]
paper_trading = true
clob_api_url = "https://clob.polymarket.com"
gamma_api_url = "https://gamma-api.polymarket.com"

[capital]
starting_balance_usd = 500
max_bet_size_usd = 25
max_concurrent_positions = 20
max_exposure_pct = 50

[strategy]
arb_threshold = 0.96
min_edge_pct = 2.0
momentum_lookback_seconds = 60
min_time_to_expiry_s = 3600        # 1 hour minimum (skip nearly-expired)
max_time_to_expiry_s = 7776000     # 90 days max
scan_all_for_arb = true            # Scan all high-liquidity markets for YES+NO arb
min_liquidity_usd = 500            # Min $500 liquidity to consider
max_markets_per_scan = 80          # Max markets per arb scan cycle

[risk]
kelly_fraction = 0.25
max_daily_loss_usd = 25
max_consecutive_losses = 5
fee_rate = 0.0156

[timing]
scan_interval_ms = 60000           # 60s between scans (long-duration markets)
settlement_check_ms = 300000       # 5 min settlement checks

[data_sources]
binance_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
use_polymarket_intelligence = true
