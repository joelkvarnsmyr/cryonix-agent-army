[broker]
paper_trading = true
clob_api_url = "https://clob.polymarket.com"
gamma_api_url = "https://gamma-api.polymarket.com"

[capital]
starting_balance_usd = 2000
max_bet_size_usd = 25
max_concurrent_positions = 80
max_exposure_pct = 95

[strategy]
arb_threshold = 0.95
min_edge_pct = 2.0
momentum_lookback_seconds = 60
min_time_to_expiry_s = 300
max_time_to_expiry_s = 1209600     # 14 days max
scan_all_for_arb = true
min_liquidity_usd = 100
max_markets_per_scan = 250

# ARB-FIRST STRATEGY: arb is 100% WR, +$4.49/trade — maximize it
arb_max_bet_size_usd = 25          # Full bet size (was 10 — arb is risk-free)
arb_max_positions = 60             # 60 of 80 slots for arb (was 30)
arb_max_exposure_pct = 80          # 80% of bankroll in arb (was 50%)
arb_max_expiry_s = 604800          # 7 days max (was 3 days — more opportunities)

[risk]
kelly_fraction = 0.25
max_daily_loss_usd = 50
max_consecutive_losses = 5
fee_rate = 0.0156

[timing]
scan_interval_ms = 30000
settlement_check_ms = 300000

[micro_markets]
enabled = false                    # DISABLED: 20% WR, -$34 — proven unprofitable

[data_sources]
binance_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
use_polymarket_intelligence = true

[exits]
enabled = true
take_profit_pct = 30
stop_loss_pct = 40
stagnation_hours = 48
min_hold_seconds = 300

[copy_trader]
enabled = false

[whale_detection]
enabled = false                    # Disabled: only boosts directional which loses money
