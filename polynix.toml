[broker]
paper_trading = true
clob_api_url = "https://clob.polymarket.com"
gamma_api_url = "https://gamma-api.polymarket.com"

[capital]
starting_balance_usd = 3000        # Added $1000 more (was 2000)
max_bet_size_usd = 25
max_concurrent_positions = 80
max_exposure_pct = 95

[strategy]
arb_threshold = 0.97              # Lowered from 0.95 → catch more arbs (3% gross, ~0% net minimum)
min_edge_pct = 2.0
momentum_lookback_seconds = 60
min_time_to_expiry_s = 300
max_time_to_expiry_s = 1209600
scan_all_for_arb = true
min_liquidity_usd = 50            # Lowered from 100 → wider net
max_markets_per_scan = 400        # Increased from 250 → scan more markets
directional_enabled = false       # DISABLED: net -$29, Bayesian vetoes anyway

# ARB-FIRST: 52/52 wins, +$231, avg +$4.45/trade
arb_max_bet_size_usd = 25
arb_max_positions = 70            # 70 of 80 slots (was 60)
arb_max_exposure_pct = 85         # 85% of bankroll (was 80%)
arb_max_expiry_s = 604800         # 7 days max

[risk]
kelly_fraction = 0.25
max_daily_loss_usd = 50
max_consecutive_losses = 5
fee_rate = 0.0156

[timing]
scan_interval_ms = 5000          # 5s (was 20s — faster arb discovery)
settlement_check_ms = 300000

[micro_markets]
enabled = false

[data_sources]
binance_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
use_polymarket_intelligence = true

[exits]
enabled = true
take_profit_pct = 30
stop_loss_pct = 40
stagnation_hours = 48
min_hold_seconds = 300

[copy_trader]
enabled = false

[whale_detection]
enabled = false
