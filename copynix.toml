[consensus]
# With 3 tracked wallets: 3 = strong, 2 = medium is reasonable
min_wallets_strong = 3
min_wallets_medium = 2
time_window_minutes = 15
cooldown_hours = 4

[capital]
max_position_size_usd = 50
max_capital_per_trade_pct = 0.20
min_order_value = 5.00

[limits]
max_open_positions = 5
max_trades_per_day = 10

[risk]
min_confidence = 0.50
max_daily_loss_pct = 0.10
max_weekly_loss_pct = 0.20
max_consecutive_losses = 4

[safety]
# Paper trading — wide open to gather data and see what happens.
# Only filter absolute zero-liquidity honeypots.
min_token_age_hours = 0
min_liquidity_usd = 0
min_holders = 0
min_lp_burnt_pct = 0
require_immutable_supply = false

[exits]
take_profit_pct = 25.0
stop_loss_pct = 15.0
trailing_stop_pct = 8.0
trailing_activation_pct = 10.0
leader_exit_enabled = true
leader_exit_timeout_s = 60
# 24h stagnation — memecoins that don't move in 24h are likely dead.
# Only exit if PnL is between 0% and 3% (flat/tiny profit = not worth holding).
# If negative, SL handles it. If above 3%, let it ride.
stagnation_timeout_hours = 24
stagnation_min_pnl_pct = 3.0

[timing]
# Main loop interval — controls exit checks, price updates, state publishing
poll_interval_ms = 30000
# Wallet scan interval — Helius API calls (40 wallets × 1 call each)
# 900s = 15 min. At 15min intervals with 40 wallets:
# 40 × 4/hour × 24h = 3,840 calls/day × 100 credits = 384K/day ≈ 11.5M/month.
# Still over 1M free tier — backoff will auto-throttle when needed.
# Consider upgrading Helius plan or reducing wallet count if 429s persist.
wallet_scan_interval_ms = 900000
# Discovery interval (7 days). Discovery uses ~10 extra Helius calls.
discovery_interval_ms = 604800000
