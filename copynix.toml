[consensus]
# With 3 tracked wallets: 3 = strong, 2 = medium is reasonable
min_wallets_strong = 3
min_wallets_medium = 2
time_window_minutes = 15
cooldown_hours = 4

[capital]
max_position_size_usd = 50
max_capital_per_trade_pct = 0.20
min_order_value = 5.00

[limits]
max_open_positions = 5
max_trades_per_day = 10

[risk]
min_confidence = 0.50
max_daily_loss_pct = 0.10
max_weekly_loss_pct = 0.20
max_consecutive_losses = 4

[safety]
min_token_age_hours = 24
min_liquidity_usd = 50000
min_holders = 50
min_lp_burnt_pct = 50
require_immutable_supply = true

[exits]
take_profit_pct = 25.0
stop_loss_pct = 15.0
trailing_stop_pct = 8.0
trailing_activation_pct = 10.0
leader_exit_enabled = true
leader_exit_timeout_s = 60
stagnation_timeout_hours = 48
stagnation_min_pnl_pct = 2.0

[timing]
# Main loop interval — controls exit checks, price updates, state publishing
poll_interval_ms = 30000
# Wallet scan interval — Helius API calls (3 wallets × 1 call each)
# 300s = 5 min. Helius free tier: 1M credits/month. At 5min intervals with
# 3 wallets: ~864 calls/day ≈ 26K/month. Well within budget.
# Auto-backoff doubles this on 429 errors (up to 10x = 50 min).
wallet_scan_interval_ms = 300000
# Discovery interval (7 days). Discovery uses ~10 extra Helius calls.
discovery_interval_ms = 604800000
