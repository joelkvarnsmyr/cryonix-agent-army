[consensus]
min_wallets_strong = 2
# DATA COLLECTION MODE: Strong=2 (was 3), Medium=1 (single wallet + consensus engine).
# Paper trading — maximize signal count for Bayesian training data.
min_wallets_medium = 1
# 15min window — generous, captures slow-following wallets.
time_window_minutes = 15
# 1h cooldown (was 4h) — allow re-entry on same token after exit
cooldown_hours = 1

[capital]
# MUTATION 2026-03-25: Raised from $50 → $100. At $50, even a +15% TP win
# yields only $7.50. At $100, TP win = $15 — enough to cover losses.
max_position_size_usd = 100
# MUTATION 2026-03-25: Raised from 0.20 → 0.30. With 3 max positions at $100,
# worst case = $300 deployed = 60% of $500. Manageable risk.
max_capital_per_trade_pct = 0.40
min_order_value = 5.00
# DATA COLLECTION MODE: Allow full portfolio deployment
max_portfolio_exposure_pct = 0.90
max_risk_per_trade_pct = 0.10

[limits]
# DATA COLLECTION MODE: Maximize trades for Bayesian training
max_open_positions = 8
max_trades_per_day = 25

[risk]
# DATA COLLECTION MODE: Low gates, let everything through.
# Goal: collect 100+ trades for statistical significance on wallet scoring.
min_confidence = 0.40
max_daily_loss_pct = 0.50
max_weekly_loss_pct = 0.80
max_consecutive_losses = 20

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  COPY TRACKER — Wallet Performance Auto-Rotation                       ║
# ║  Tracks per-wallet P&L and auto-promotes/demotes based on results.     ║
# ║  Wallets that consistently lose get removed; winners get promoted      ║
# ║  to single-whale status.                                               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[copy_tracker]
enabled = true
# DATA COLLECTION MODE: Fast learning — promote/demote after fewer trades
promote_threshold = 70
demote_threshold = 35
remove_threshold = 20
# Snabbare beslut: promote efter 3 trades, demote efter 5, remove efter 10
min_trades_promote = 3
min_trades_demote = 5
min_trades_remove = 10

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  SINGLE-WHALE MODE                                                     ║
# ║  Wallets with score >= threshold can trigger trades WITHOUT consensus.  ║
# ║  This is the key to Copynix's edge — follow the best wallets instantly.║
# ╚══════════════════════════════════════════════════════════════════════════╝

[single_whale]
enabled = true
# MUTATION 2026-03-25: Lowered from 80 → 75. At 80, only 3 manual seed
# wallets qualified. At 75, CopyTracker can promote Dune wallets after
# 5 profitable trades. This unlocks the self-improving feedback loop.
min_score = 70
# DATA COLLECTION MODE: Same size as consensus — want comparable data
max_position_pct = 0.30
# Relaxed for data collection (main safety gate still applies)
min_token_age_hours = 4

[safety]
# DATA COLLECTION MODE: Relaxed safety — paper trading, want data on ALL token types
# including risky ones (to train scam detection in CopyTracker/Bayesian)
min_token_age_hours = 2
min_liquidity_usd = 10000
min_holders = 50
max_fdv_liquidity_ratio = 50
min_lp_burnt_pct = 0
require_immutable_supply = false

[exits]
# Reduced TP from 25% to 15% — data shows avg win is only $5.46.
# Capturing smaller gains more often > holding for moonshots that never come.
take_profit_pct = 15.0
# Tighter stop losses across all phases — avg loss was -$10.37
rug_sl_pct = 12.0
rug_window_minutes = 2
standard_sl_pct = 18.0
wide_sl_pct = 25.0
wide_sl_after_minutes = 30
trailing_stop_pct = 8.0
trailing_activation_pct = 10.0
leader_exit_enabled = true
leader_exit_timeout_s = 60
# Reduced stagnation from 24h to 12h — memecoins that don't move fast are dead
stagnation_timeout_hours = 12
stagnation_min_pnl_pct = 2.0

[timing]
# Main loop: 30s — controls exits, prices, state, AND priority wallet polling
poll_interval_ms = 30000
# Regular wallet scan: 2 min (priority wallets bypass this, polled every 30s)
wallet_scan_interval_ms = 120000
# Discovery interval (7 days). Discovery uses ~10 extra Helius calls.
discovery_interval_ms = 604800000
