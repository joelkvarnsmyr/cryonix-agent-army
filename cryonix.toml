fed_dovish_threshold = 70
fed_dovish_boost = 0.04
fed_hawkish_threshold = 30
fed_hawkish_penalty = 0.05

# ── Geopolitical risk ────────────────────────────────────────────────
# When conflict/escalation probability is high (bullish score < 30):
