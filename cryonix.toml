[polymarket]
enabled = true

# Poll interval in seconds. 900 = 15 minutes.
# Gamma API is free with no published rate limits.
poll_interval_seconds = 900

# ── Crypto sentiment ─────────────────────────────────────────────────
# When Polymarket crowd is very bearish on crypto (score < 20):
