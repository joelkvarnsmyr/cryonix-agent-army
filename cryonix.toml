min_trades_before_removal = 5

# Minimum days a symbol must be on watchlist before removal consideration.
# 14 = 2 weeks. Gives new symbols time to generate enough history.
min_days_on_watchlist = 14

# Market cap rank limit for candidate pool (CMC integration required).
# 150 = only consider top 150 coins by market cap.
# Prevents adding micro-cap / illiquid symbols.
candidate_pool_cmc_rank_limit = 150

