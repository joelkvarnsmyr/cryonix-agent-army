poll_interval_seconds = 900

# ── V3 Research-Validated Signals (2026-03-15) ─────────────────────
# Deep research: 6 symbols × 2000 days, regime-controlled, OOS validated.
# Only statistically significant signals (p<0.05) are used.

# Venus Retrograde: STRONGEST signal (p<0.0001 in ALL market regimes).
