# fear_greed_skip_above: don't rotate when F&G > 85 (extreme greed → avoid chasing tops)
fear_greed_skip_below = 15
fear_greed_skip_above = 85


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  INTELLIGENT ALERT SYSTEM                                              ║
# ║  4-tier severity with confirmation counter.                            ║
# ║  Replaces binary warning/critical with graduated response.             ║
# ║  Change when: tuning alert sensitivity or TTL durations.               ║
# ║  Affects: BUY signal blocking, SL tightening, force-close triggers.    ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[alerts]

# TTL per severity level (seconds). Alert expires after this duration.
# info: routine activity, no action taken
# warning: multiple confirming signals, blocks BUY when confirmed_count >= 2
# critical: confirmed threat, blocks BUY, tightens SL to breakeven
# emergency: acute existential threat, force-closes open positions
severity_ttl_info = 1800        # 30 min
severity_ttl_warning = 7200     # 2h
severity_ttl_critical = 21600   # 6h
severity_ttl_emergency = 43200  # 12h

# Ignore events older than this many hours (stale tweet guard)
freshness_max_hours = 4

# Minimum confirmed_count before warning-level alerts trigger action
min_confirmations_for_action = 2

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  MOONSHOT DETECTION                                                    ║
# ║  Scores each signal 0-100 for trade classification.                    ║
# ║  <30 = scalp, 30-69 = standard, 70+ = moonshot.                       ║
# ║  Affects: exit profile selection (tiered exits).                       ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[moonshot]
enabled = true
volume_threshold = 2.0            # Volume vs 20-period avg for +30 score
atr_expansion_threshold = 1.5     # Current ATR vs ATR 20 periods ago for +15 score
moonshot_threshold = 70           # Score above this = moonshot trade type
scalp_threshold = 30              # Score below this = scalp trade type


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  CONFIDENCE MODEL V2                                                    ║
# ║  Controls how post-AI intelligence adjustments combine.                 ║
# ║  "additive" = legacy sequential ±% adjustments (V1)                    ║
# ║  "multiplicative" = grouped correlation model (V2)                      ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[confidence_model]
mode = "multiplicative"
max_group_modifier = 0.15

[bayesian]
use_softmax_ranking = true
use_kelly_sizing = true
softmax_temperature = 2.0
min_observations_for_kelly = 10

[sizing]
vol_adjusted = true
baseline_atr_pct = 0.3
min_vol_factor = 0.5
max_vol_factor = 1.5

[htf_filter]
enabled = true
bearish_penalty = 0.10

# ── ORAKEL Forecast Engine ──────────────────────────────────
[orakel]
enabled = true
symbols = ["BTC/USDC", "ETH/USDC", "SOL/USDC", "BNB/USDC"]
hourly_interval_seconds = 3600
daily_hour_utc = 0
retrain_interval_days = 7
weight_in_auto_trade = 0.20
min_confidence_to_publish = 0.10
