# ============================================================================
#  CRYONIX CONFIGURATION — Single source of truth for ALL trading parameters
# ============================================================================
#
#  This file is read by BOTH TypeScript (auto-trade/route.ts) and Python
#  (engine quant.py, risk_manager.py, market_scout.py, news_scout.py).
#
#  Mounted into Docker containers as a read-only volume:
#    ./cryonix.toml:/app/cryonix.toml:ro
#
#  Secrets (API keys, DB URLs, tokens) stay in .env — NEVER put them here.
#
#  HOW TO APPLY CHANGES:
#    1. Edit this file
#    2. Restart affected containers:
#       docker compose -f docker-compose.prod.yml restart web auto-trader engine
#    3. Check logs to verify: docker logs cryonix-web-1 --tail 5
#       You should see: [CONFIG] Loaded cryonix.toml from /app/cryonix.toml
#
#  SAFETY: Every value has a hardcoded fallback in the code. If you delete
#  a key or the file is missing, the system falls back to safe defaults.
#
# ============================================================================


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BASELINE MODE                                                         ║
# ║  When frozen = true, AI Brain and Evolution Engine skip their runs.    ║
# ║  Use: python3 scripts/strategy-lab/baseline.py freeze                  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[baseline]
frozen = false
frozen_at = ""
frozen_by = ""
baseline_id = ""


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  TRADING MODE                                                          ║
# ║  Controls HOW the system interacts with Binance.                       ║
# ║  Change when: switching between spot and margin trading.               ║
# ║  Affects: order types, leverage, whether SHORT signals are allowed.    ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[trading]

# Which Binance trading mode to use.
#   "spot"   — Buy with cash, sell what you own. Safest mode.
#   "margin" — Borrow to trade. Enables shorting. Requires margin account.
#   "future" — Derivatives trading. Not currently supported.
# When to change: only if you've enabled margin on Binance and understand
# the liquidation risks. Spot is recommended for accounts < $500.
mode = "spot"

# When true, all SELL/SHORT signals are rejected before reaching AI validation.
# This saves API tokens and prevents accidental shorts in spot mode.
# When to change: set to false when mode = "margin" to allow shorting.
spot_only = true

# Margin type — only relevant when mode = "margin".
#   "cross"    — All margin shared across positions (lower liquidation risk).
#   "isolated" — Each position has its own margin (limits loss per trade).
margin_type = "cross"

# Maximum leverage multiplier for margin/future trades.
# Higher = more profit potential but closer liquidation price.
# 3x is conservative. Never go above 5x on a small account.
default_leverage = 3


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  CAPITAL & POSITION SIZING                                             ║
# ║  Controls HOW MUCH money goes into each trade.                         ║
# ║  Change when: account size changes, or you want more/less aggressive   ║
# ║  position sizing.                                                      ║
# ║  Affects: order sizes, capital allocation between strategies.           ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[capital]

# Maximum percentage of total capital allowed in a single position.
# 0.25 = 25%. On a $40 account, max position = $10.
# Increase for concentrated bets, decrease for diversification.
# WARNING: above 0.30 a single bad trade can wipe significant capital.
max_position_size_pct = 0.25

# Absolute minimum order value in USD. Orders below this are rejected.
# Binance NOTIONAL minimum is ~$5. We use $7.50 to prevent "dust" —
# positions that drop below $5 and become unsellable.
# When to change: only if Binance changes their NOTIONAL minimum.
min_order_value = 7.50

# Capital allocation split between strategies. Must sum to ~1.0.
#   signal_pool — for TA/AI-validated signal trades (the main strategy)
#   grid_pool   — for grid DCA trades (buy at preset levels)
#   reserve     — always kept as free cash (safety buffer)
# When to change: increase grid_pool in ranging markets, increase reserve
# if you want more safety margin.
signal_pool_pct = 0.85
grid_pool_pct = 0.00
reserve_pct = 0.15

# Kelly Criterion position sizing multiplier.
# Full Kelly (1.0) is mathematically optimal but extremely volatile.
# Half-Kelly (0.5) gives ~75% of the growth with much less drawdown.
# When to change: lower to 0.3 if experiencing large swings, raise to
# 0.7 only with a proven edge and large sample size.
kelly_fraction_multiplier = 0.5

# Deep value crash trades: maximum capital allocation and minimum confidence.
# These are "fat pitch" trades on large drawdowns (8%+).
# deep_value_max_pct: max % of capital for a single deep value trade.
# deep_value_min_confidence: minimum blended confidence (TA + AI) required.
# When to change: lower max_pct if you don't trust crash buying, raise
# min_confidence to be more selective.
deep_value_max_pct = 0.20
deep_value_min_confidence = 0.80


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  POSITION LIMITS                                                       ║
# ║  Controls HOW MANY positions can be open simultaneously.               ║
# ║  Change when: account grows (more positions) or shrinks (fewer).       ║
# ║  Affects: diversification, capital utilization, risk exposure.          ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[limits]

# Total concurrent open positions across all strategies.
# $41 capital / $8.50 per position ≈ 4.9 → 5 slots.
# Increase as account grows: 8 for $100+, 12 for $500+.
max_open_positions = 5

# Sub-limits per strategy type. Must sum to <= max_open_positions.
max_signal_positions = 4
max_grid_positions = 1

# Maximum trades executed per calendar day (UTC).
# Prevents overtrading in choppy markets. Resets at midnight UTC.
# When to change: lower in bear markets, raise in strong trends.
max_trades_per_day = 10

# Signal queue trim threshold. When more than this many signals are
# queued, the oldest/weakest are dropped to prevent memory bloat.
# Rarely needs changing.
max_pending_queue = 30


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  RISK MANAGEMENT                                                       ║
# ║  Circuit breakers and safety limits that STOP trading when hit.        ║
# ║  Change when: adjusting risk tolerance or after reviewing performance. ║
# ║  Affects: when trading pauses, which signals are rejected.             ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[risk]

# Daily loss circuit breaker. Trading pauses for 24h if daily P&L
# drops below -(total_capital * this value).
# 0.05 = 5%. On $40, trading stops after -$2 daily loss.
# When to change: tighten (0.03) if capital preservation is priority,
# loosen (0.08) if you accept more volatility.
max_daily_loss_pct = 0.05

# Weekly loss circuit breaker. Same logic, 7-day window.
# 0.10 = 10%. On $40, stops after -$4 weekly loss.
max_weekly_loss_pct = 0.10

# Consecutive loss protection. After N losses in a row without a win,
# trading pauses for 4 hours (cooling period).
# When to change: lower if you want faster pauses, raise if the system
# frequently hits this during normal volatile periods.
max_consecutive_losses = 5

# Maximum correlation between open positions. Prevents holding
# multiple correlated assets (e.g., BTC + ETH during a crash).
# 0.70 = 70% correlation threshold. Not actively enforced yet (future).
max_correlation = 0.70

# Volatility circuit breaker. If a coin's ATR (Average True Range)
# exceeds this % of price, position size is reduced proportionally.
# 5.0 = 5% ATR. Most large-caps have 2-4% ATR normally.
# When to change: raise in crypto bull markets (higher baseline vol).
volatility_pause_atr_pct = 5.0

# Margin liquidation safety buffer. Only relevant when mode = "margin".
# If stop-loss would be placed beyond (liquidation_price * buffer),
# the system tightens the SL to stay inside the safe zone.
# 0.15 = 15% buffer. At 3x leverage, liquidation is ~33% away.
liquidation_buffer_pct = 0.15

# Minimum signal confidence required to pass risk gate.
# Signals below this are rejected before AI validation (saves tokens).
# 0.65 = 65%. Lower means more trades (more opportunity + more noise).
# When to change: raise to 0.70-0.75 if too many losing trades,
# lower to 0.60 if not enough trades are executing.
min_confidence = 0.70

# Minimum reward-to-risk ratio. Rejects signals where the potential
# profit (entry to TP) divided by potential loss (entry to SL) is
# below this threshold.
# 1.3 means you need $1.30 potential profit for every $1 of risk.
# When to change: raise to 1.5 for more selective entries, lower
# to 1.1 if your win rate is high (>60%).
min_risk_reward = 1.3


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  STOP-LOSS, TAKE-PROFIT & TRAILING STOP                               ║
# ║  Controls WHERE exits are placed relative to entry price.              ║
# ║  Change when: tuning exit strategy after reviewing closed trades.      ║
# ║  Affects: win rate, average win/loss size, holding time.               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[exits]

# Trailing stop distance as % of price. Once a position reaches
# trailing_activation_pct profit, the stop follows price upward,
# always staying this % below the highest price seen.
# 3.0 = 3%. Wider = more room to breathe, tighter = locks in profit faster.
# When to change: widen (4-5%) for volatile coins, tighten (2%) for stable.
trailing_stop_pct = 3.0

# Minimum profit % before trailing stop activates.
# Below this threshold, only the fixed stop-loss is active.
# 1.5 = 1.5%. Prevents trailing stop from triggering on small noise.
# When to change: raise to 2-3% if positions are getting stopped out
# too early on minor pullbacks.
trailing_activation_pct = 2.5

# Maximum allowed slippage between signal entry price and current market
# price when the order is about to execute. Rejects if exceeded.
# 0.5 = 0.5%. Protects against buying at a much worse price than analyzed.
max_slippage_pct = 0.5

# Maximum bid-ask spread. Pairs with wider spreads are skipped.
# 0.3 = 0.3%. Ensures we only trade liquid pairs.
# When to change: raise to 0.5% if trading lower-cap coins.
max_spread_pct = 0.3

# How many levels of the order book to check for spread calculation.
# 5 = top 5 bids and asks. Higher = more accurate but slower.
orderbook_depth = 5

# ATR-based stop-loss and take-profit multipliers.
# SL = entry_price - (sl_atr_multiplier * ATR)  [for BUY]
# TP = entry_price + (tp_atr_multiplier * ATR)  [for BUY]
# The ratio tp/sl determines the risk-reward. Current: 6.0/3.5 = 1.71 R:R
# When to change:
#   - Tighter SL (2.5-3.0): fewer large losses, more small stopouts
#   - Wider TP (6.0-8.0): bigger wins but lower win rate
#   - The tp/sl ratio should stay above min_risk_reward (1.3)
sl_atr_multiplier = 3.5
tp_atr_multiplier = 6.0

# Deep value crash trades use wider ATR multipliers — crash bounces
# are sharp but need room to breathe. R:R = 8.0/6.0 = 1.33.
deep_value_sl_atr = 6.0
deep_value_tp_atr = 8.0

# Stagnation exit timeout. If a position hasn't moved more than 1%
# (in either direction) after this many hours, sell it to free the slot
# for higher-conviction signals. 8h is conservative — most breakouts
# happen within 4h of pattern detection.
# When to change: lower to 6h for faster turnover, raise to 12h for patience.
stagnation_timeout_hours = 8

# Native Binance stop-loss limit order offset.
# When placing a STOP_LOSS_LIMIT on Binance, the limit price is set
# slightly below the stop price to ensure the order fills.
# 0.005 = 0.5% below stop price. Too tight and it may not fill
# during fast moves. Too wide and you get worse fill prices.
native_sl_limit_offset = 0.005


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  TECHNICAL INDICATORS                                                  ║
# ║  Parameters for the QuantGuild analysis engine (Python).               ║
# ║  Change when: backtesting shows different periods perform better.      ║
# ║  Affects: signal detection sensitivity and timing.                     ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[indicators]

# RSI (Relative Strength Index) — momentum oscillator.
# rsi_period: lookback window. 14 is the standard. Lower = more sensitive.
# rsi_oversold: below this generates a BUY signal. Tightened to 30
#   with multi-TF confirmation (1h RSI < 40) reducing false positives.
# rsi_overbought: above this generates a SELL signal.
# When to change: widen the range (25/75) for fewer signals,
# narrow (35/65) for more signals.
rsi_period = 14
rsi_oversold = 30
rsi_overbought = 70

# Bollinger Bands — volatility + mean reversion indicator.
# bollinger_period: SMA lookback. 20 is standard.
# bollinger_std: standard deviations for upper/lower bands. 2.0 is standard.
# bollinger_squeeze_pct: width percentile threshold. When band width is
#   in the bottom 20% of recent history, a "squeeze" breakout is expected.
# When to change: lower squeeze_pct (15) for fewer but stronger signals.
bollinger_period = 20
bollinger_std = 2.0
bollinger_squeeze_pct = 20

# MACD (Moving Average Convergence Divergence) — trend + momentum.
# Standard parameters (12, 26, 9) are almost universally used.
# When to change: rarely. Some prefer (8, 21, 5) for faster signals.
macd_fast = 12
macd_slow = 26
macd_signal = 9

# EMA (Exponential Moving Average) crossover — trend direction.
# ema_fast crosses above ema_slow = bullish, below = bearish.
# 9/21 is common for short-term trading on 15m candles.
# When to change: use 12/26 for slightly longer-term signals.
ema_fast = 9
ema_slow = 21

# ATR (Average True Range) — volatility measurement.
# Used for dynamic SL/TP placement and regime classification.
# 14 is standard. Lower = more reactive to recent volatility.
atr_period = 14

# ADX (Average Directional Index) — trend strength.
# adx_period: lookback. 14 is standard.
# adx_trending_threshold: ADX >= this = market is trending.
#   Below = ranging. Used for regime classification and signal filtering.
# When to change: raise to 30 if you only want strong trends.
adx_period = 14
adx_trending_threshold = 25

# Volume analysis parameters.
# volume_sma_period: lookback for average volume calculation.
# volume_spike_threshold: current vol must be >= this * average to
#   trigger a VOLUME_SPIKE pattern. 2.0 = double normal volume.
# volume_confirmation: minimum ratio to consider volume "confirmed"
#   for consensus boosting. 1.2 = 20% above average.
# When to change: raise spike to 2.5-3.0 for fewer false signals.
volume_sma_period = 20
volume_spike_threshold = 2.0
volume_confirmation = 1.2

# Minimum candles required before the engine will analyze a symbol.
# Below this, indicator calculations are unreliable.
# 50 candles of 15m = 12.5 hours of data minimum.
min_candles = 50


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  PATTERN DETECTION                                                     ║
# ║  Thresholds that control when specific patterns trigger.               ║
# ║  Change when: backtesting shows different thresholds improve results.  ║
# ║  Affects: which patterns fire, signal frequency.                       ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[patterns]

# DIP BUY — mean reversion: buy when price dropped from recent high.
# dip_buy_drawdown: minimum drawdown from N-bar high to trigger. 0.05 = 5%.
# dip_buy_lookback: how many bars back to look for the recent high.
# dip_buy_max_rsi: RSI must be below this (avoids buying into strength).
# When to change: raise drawdown to 0.07-0.10 for fewer, deeper dips.
dip_buy_drawdown = 0.05
dip_buy_lookback = 20
dip_buy_max_rsi = 50

# DEEP VALUE CRASH — large drawdown (8%+) with multi-timeframe confirmation.
# deep_value_threshold: minimum drawdown to trigger deep value analysis.
#   0.08 = 8%. Only ~2-3 signals per month at this level.
# deep_value_support_lookback_days: how far back to find support levels.
# deep_value_rug_pull_velocity: if price drops faster than this %/hour,
#   confidence is heavily penalized (likely rug pull or flash crash).
# When to change: raise threshold to 0.12 for only extreme crashes.
deep_value_threshold = 0.08
deep_value_support_lookback_days = 14
deep_value_rug_pull_velocity = 20.0


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  PATTERN CONSENSUS GATE                                                ║
# ║  Multi-pattern confirmation logic. Single patterns are weak.           ║
# ║  Change when: adjusting the balance between signal quality & quantity. ║
# ║  Affects: how many signals pass through to AI validation.              ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[consensus]

# Confidence multiplier when only 1 pattern detected.
# 0.5 = halve the confidence. This effectively blocks most single-pattern
# signals from reaching the 65% minimum confidence threshold.
# When to change: raise to 0.7 if you trust single-pattern signals more.
single_pattern_penalty = 0.65

# Confidence boosts for multiple confirming patterns.
# 2 patterns: +10%, 3+ patterns: +15%.
# These stack with the base pattern confidence.
# When to change: lower if too many low-quality signals pass.
two_pattern_boost = 0.10
three_pattern_boost = 0.15

# Penalty applied to trend-following signals (MACD, EMA crossover)
# when the market regime is classified as "ranging" (ADX < 25).
# Trend signals in ranging markets have historically low win rates.
# When to change: raise to 0.10 if trend signals keep losing in ranges.
ranging_trend_penalty = 0.15


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  MARKET REGIME CLASSIFICATION                                          ║
# ║  Determines if market is volatile, trending, or ranging.               ║
# ║  The regime controls capital allocation and pattern filtering.         ║
# ║  Change when: adjusting how aggressively the system responds to        ║
# ║  different market conditions.                                          ║
# ║  Affects: capital split between signal/grid/reserve pools.             ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[regime]

# ATR expansion ratio to classify market as "volatile".
# If current ATR > mean ATR * this value = volatile regime.
# 2.0 = ATR must be 2x the recent average.
# When to change: lower (1.5) to be more cautious, raise (2.5) to only
# flag extreme volatility.
volatile_atr_expansion = 2.0

# Capital allocation overrides per regime. These replace the base
# signal_pool_pct / grid_pool_pct / reserve_pct when the regime changes.
#
# VOLATILE: grid is paused (too risky), reserve increased for safety.
volatile_signal_pct = 0.70
volatile_grid_pct = 0.00
volatile_reserve_pct = 0.30
#
# TRENDING: signal pool boosted (trend strategies excel), grid reduced.
trending_signal_pct = 0.85
trending_grid_pct = 0.00
trending_reserve_pct = 0.15
#
# RANGING: uses default capital.* values (grid works well in ranges).


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  SIGNAL BOOSTING                                                       ║
# ║  External signal sources that boost or confirm TA signals.             ║
# ║  Change when: tuning how much external data influences decisions.      ║
# ║  Affects: signal confidence before AI validation.                      ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[boosting]

# GainerScanner boost — top movers on Binance get confidence boost.
# gainer_min_change_pct: 1h price change must exceed this to qualify.
#   3.0 = 3% in 1 hour. Only strong movers.
# gainer_confidence_boost: confidence added when signal + gainer align.
#   0.10 = +10%. This can push a borderline signal over the min threshold.
# When to change: raise min_change to 5.0 for only explosive moves.
gainer_min_change_pct = 3.0
gainer_confidence_boost = 0.10

# Telegram signal convergence — external channel signals.
# telegram_window_minutes: ignore Telegram signals older than this.
#   30 = 30 minutes. Crypto signals go stale fast.
# telegram_boost_enabled: when false, Telegram data is logged but
#   doesn't affect trading decisions. Set true to activate boosting.
# When to change: enable after verifying Telegram signal quality.
telegram_window_minutes = 30
telegram_boost_enabled = false


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  EV MODEL & CALIBRATION                                               ║
# ║  Expected Value model using historical trade data.                     ║
# ║  Patterns with negative EV (historically lose money) are rejected.     ║
# ║  Change when: you have more trade history to work with.                ║
# ║  Affects: which patterns are allowed to trade.                         ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[ev_model]

# Minimum number of historical trades for a pattern before its EV
# is considered statistically meaningful.
# 5 is a low bar — raise to 10-20 as trade history grows.
# When to change: increase after accumulating 100+ total trades.
min_trades_for_ev = 5

# Calibration lookback window and minimum sample size.
# calibration_lookback_days: how far back to analyze trade performance.
# calibration_min_trades: minimum trades per pattern in that window.
calibration_lookback_days = 30
calibration_min_trades = 3


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  X SENTIMENT & RISK ALERTS                                            ║
# ║  Social media sentiment analysis from X (Twitter) via GROK.           ║
# ║  Change when: adjusting sensitivity to social media signals.           ║
# ║  Affects: whether BUY signals are blocked due to negative news.        ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[sentiment]

# How long sentiment scores remain valid in Redis (seconds).
# 3600 = 1 hour. After expiry, sentiment is treated as neutral.
# When to change: lower to 1800 (30min) for faster reaction to news,
# raise to 7200 (2h) if sentiment changes too frequently.
expiration_seconds = 3600

# Keywords that trigger an automatic BUY rejection when found in
# X/Twitter alerts for a coin. Any match = signal blocked.
# When to change: add industry-specific terms as new threats emerge.
alert_keywords = [
    "hack", "exploit", "rug", "sec", "crash", "delist",
    "lawsuit", "ban", "scam", "fraud", "investigation", "vulnerability",
    "freeze", "insolvency", "bankrupt"
]


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  AI VALIDATION (GROK)                                                 ║
# ║  GROK AI provides a "second opinion" on every trading signal.         ║
# ║  Change when: tuning AI aggressiveness or switching models.            ║
# ║  Affects: API costs, signal approval rate, confidence blending.        ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[ai]

# Master switch for AI validation. When false, signals skip AI
# and trade based on TA confidence alone. NOT recommended.
enabled = true

# Which GROK model to use.
#   "grok-4-1-fast-reasoning" — Best: 2M context, reasoning mode, $0.20/$0.50/1M tokens
#   "grok-4-1-fast-non-reasoning" — Same model without thinking (faster, no reasoning tokens)
#   "grok-3-mini" — Cheapest fallback
# Reasoning mode enables multi-step thinking before answering.
# reasoning_effort controls depth: "low" (fast), "high" (thorough).
model = "grok-4-1-fast-reasoning"
reasoning_effort = "high"

# Temperature controls randomness. 0.0 = deterministic, 1.0 = creative.
# 0.1 = nearly deterministic. Good for consistent risk analysis.
temperature = 0.1

# Maximum completion tokens (includes reasoning + response).
# Reasoning models need more tokens for their thinking process.
# 800 allows ~500 thinking tokens + 300 response tokens.
max_tokens = 800

# Confidence blending weights. Final confidence = (TA * ta_weight) + (AI * ai_weight).
# Must sum to 1.0. grok-4.1-fast-reasoning is strong enough to justify 40% weight.
# When to change: shift toward AI (0.5/0.5) if reasoning model proves accurate,
# shift toward TA (0.7/0.3) if AI gives inconsistent results.
ta_weight = 0.60
ai_weight = 0.40


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  TIMING & POLLING                                                      ║
# ║  How often each component runs its main loop.                          ║
# ║  Change when: optimizing API rate limits or system responsiveness.     ║
# ║  Affects: latency, API call volume, system load.                       ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[timing]

# Auto-trader main loop interval. Polls /api/auto-trade every N ms.
# 30000 = 30 seconds. Faster = more responsive but more Binance API calls.
# When to change: lower to 15000 in fast markets, raise to 60000 to
# reduce API load.
auto_trader_poll_ms = 30_000

# Health check interval for the dashboard status endpoint.
health_check_interval_ms = 300_000

# Telegram bot polling interval.
telegram_poll_ms = 1_000

# How often to check for new trades to send alerts about.
trade_alert_poll_ms = 15_000

# WebSocket heartbeat and timeout for the real-time dashboard.
ws_heartbeat_ms = 30_000
ws_timeout_ms = 90_000

# CACHE TTLs — how long cached data is considered fresh.
# capital_cache_ms: how often to re-fetch actual account balance from Binance.
#   300000 = 5 min. Lower = more accurate but more API calls.
# calibration_cache_ms: how often to refresh pattern win-rate statistics.
#   1800000 = 30 min. No need to refresh more often.
# regime_ttl_seconds: how long a market regime classification is valid.
#   3600 = 1 hour. Regime changes slowly.
capital_cache_ms = 300_000
calibration_cache_ms = 1_800_000
regime_ttl_seconds = 3600

# RECONCILIATION — balance verification between Redis and Binance.
# reconcile_interval_ms: how often to check for phantom positions.
#   600000 = 10 min. Catches positions that were sold outside the system.
reconcile_interval_ms = 600_000

# Instance lock prevents multiple environments from trading the same
# Binance account simultaneously. TTL must be > auto_trader_poll_ms.
# Reduced from 90s to 60s for faster recovery after deploys.
instance_lock_ttl_seconds = 60

# Per-position atomic lock timeout for Redis read-modify-write operations.
# 5 seconds is generous. Only increase if seeing lock timeouts in logs.
position_lock_ttl_seconds = 5


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ENGINE (PYTHON)                                                       ║
# ║  Python market scanning engine parameters.                             ║
# ║  Change when: adjusting scan frequency or data resolution.             ║
# ║  Affects: signal detection speed, API call volume.                     ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[engine]

# Candle timeframe for market scanning. "15m" = 15-minute candles.
# Options: "1m", "5m", "15m", "1h", "4h", "1d"
# 15m is the sweet spot for active trading (not too noisy, not too slow).
# When to change: "5m" for more signals (more noise), "1h" for swing trading.
timeframe = "15m"

# How many candles to fetch per scan. 100 * 15m = 25 hours of data.
# More candles = more accurate indicators but slower API calls.
# Minimum useful: 50 (set by indicators.min_candles).
candle_limit = 100

# How often NewsScout runs sentiment analysis (seconds).
# 900 = 15 minutes. News doesn't change fast enough to justify more.
news_scan_interval_seconds = 900


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  GRID TRADING                                                          ║
# ║  DCA grid strategy parameters.                                         ║
# ║  Change when: adjusting grid sensitivity.                              ║
# ║  Affects: how precisely price must hit a grid level to trigger.        ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[grid]

# How close the current price must be to a grid level to trigger a buy.
# 0.0015 = 0.15%. At $100, triggers within $0.15 of the level.
# When to change: raise to 0.003 (0.3%) for more triggers in fast markets,
# lower to 0.001 for more precise entries.
level_trigger_tolerance = 0.0015


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  RECONCILIATION & DUST PREVENTION                                      ║
# ║  Detects and handles mismatches between Redis state and Binance.       ║
# ║  Change when: adjusting sensitivity of mismatch detection.             ║
# ║  Affects: phantom position cleanup, warning thresholds.                ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[reconciliation]

# Phantom position threshold. If actual Binance balance is less than
# this fraction of what Redis claims, the position is considered
# "phantom" (sold outside the system) and is removed.
# 0.10 = 10%. If Redis says 100 tokens but Binance has <10, it's phantom.
phantom_threshold = 0.10

# Mismatch warning thresholds. Logs a warning (but doesn't auto-fix)
# when actual balance differs from expected.
# mismatch_warning_low: warn if actual < (expected * low). Default logs
#   all mismatches below 10% (same as phantom — caught above).
# mismatch_warning_high: warn if actual < (expected * high). 0.90 = 90%.
#   Catches partial sells or fee deductions.
mismatch_warning_low = 0.10
mismatch_warning_high = 0.90

# Minimum position value to attempt selling. Below this, Binance
# rejects the order (NOTIONAL filter) and it becomes unsellable dust.
# Should match or be slightly below min_order_value.
dust_sell_floor = 5.0


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  COINMARKETCAP INTEGRATION                                             ║
# ║  Macro-level market intelligence from CoinMarketCap API (Free tier).   ║
# ║  Provides Fear & Greed, global metrics, and market cap data that       ║
# ║  the Python engine writes to Redis for the auto-trader to consume.     ║
# ║  Change when: tuning how macro data influences trading decisions.      ║
# ║  Affects: signal confidence adjustments, regime detection, filtering.  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

[coinmarketcap]

# Master switch. When false, CMCScout does not run and auto-trader
# skips all CMC-based checks. Enable after adding CMC_API_KEY to .env.
enabled = true

# How often CMCScout polls CoinMarketCap (seconds).
# 600 = 10 min. With batched quote calls this uses ~5,500 credits/month
# (well within the 10,000 free tier limit).
# When to change: lower to 300 (5min) if on Hobbyist plan ($29/mo).
poll_interval_seconds = 600

# ── Fear & Greed Adjustments ──────────────────────────────────────────
# When Fear & Greed Index is in "Extreme Fear" (< fear_threshold):
#   - DEEP_VALUE_CRASH signals get +fear_deep_value_boost confidence
#   - All other BUY signals require confidence >= fear_min_confidence
# When F&G is in "Extreme Greed" (> greed_threshold):
#   - All BUY signals get -greed_confidence_penalty
#
# When to change: widen thresholds (15/85) for less sensitivity,
# narrow (25/75) for more aggressive macro filtering.
fear_threshold = 20
greed_threshold = 80
fear_deep_value_boost = 0.08
fear_min_confidence = 0.85
greed_confidence_penalty = 0.10

# ── Market Cap Filter ─────────────────────────────────────────────────
# Reject BUY signals for coins ranked below this in market cap.
# 500 = top 500 coins only. Prevents trading illiquid micro-caps.
# Set to 0 to disable market cap filtering.
# When to change: raise to 200 for ultra-conservative, lower to 1000
# if you want to trade smaller coins.
max_rank = 500

# Reject if Fully Diluted Valuation / Market Cap ratio exceeds this.
# High FDV/MC means massive token unlocks ahead (dilution risk).
# 4.0 = FDV is 4x current market cap. Most blue chips are < 2.0.
# Set to 0 to disable FDV filter.
# When to change: lower to 3.0 for stricter filtering.
max_fdv_mc_ratio = 4.0

# ── Global Market Regime ──────────────────────────────────────────────
# These enhance the existing regime detection (ADX-based) with
# macro data from CoinMarketCap global metrics.
#
# If total crypto market cap drops more than this % in 24h,
# override regime to "volatile" (pauses grid, increases reserve).
# 3.0 = 3% total market cap decline in one day.
global_mc_drop_volatile_pct = 3.0

# If BTC dominance rises more than this % in 24h,
# reduce confidence for altcoin signals (capital rotating to BTC).
# 2.0 = 2% dominance increase (e.g., 52% -> 54%).
btc_dominance_rise_alt_penalty = 2.0
alt_dominance_penalty = 0.05
