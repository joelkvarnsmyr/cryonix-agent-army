[broker]
paper_trading = true

[watchlist]
symbols = ["SOL", "JUP", "BONK", "WIF", "PYTH", "RNDR", "RAY", "ORCA", "JTO", "W", "HNT", "DRIFT", "POPCAT", "MEW"]
timeframe = "1h"
bars_count = 100

[capital]
max_position_size_usd = 50
max_capital_per_trade_pct = 0.95
min_order_value = 1.00

[limits]
max_open_positions = 5
max_trades_per_day = 20

[risk]
min_confidence = 0.48                  # Eased from 0.55 — too tight with VIX macro penalty (-8%)
max_daily_loss_pct = 0.05
max_weekly_loss_pct = 0.10
max_consecutive_losses = 3

[exits]
take_profit_pct = 8.0
stop_loss_pct = 6.0                    # Widened from 4.0 — avoid whipsaw on Solana volatility
trailing_stop_pct = 5.0
trailing_activation_pct = 3.0
stagnation_timeout_days = 3
stagnation_min_pnl_pct = 0.5

[timing]
poll_interval_ms = 60000
signal_scan_interval_ms = 300000       # 5 min (was 15 min — catch moves earlier)
dexscreener_scan_interval_ms = 180000  # 3 min (was 5 min — faster discovery)

[rotation]
enabled = true
min_score_advantage = 30
min_hold_minutes = 120

[signals]
min_signal_score = 0.50                # Raised from 0.40 — higher signal quality bar
dexscreener_enabled = true
dexscreener_min_liquidity_usd = 100000 # Raised from 50k — avoid thin-liquidity traps
dexscreener_volume_spike_multiplier = 3.0
dexscreener_dynamic_ttl_ms = 7200000
