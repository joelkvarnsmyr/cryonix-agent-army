# alphanix.toml — Alphanix Multi-Asset AI Trading Army

[orchestrator]
max_pods = 10
capital_total_usd = 10000
rebalance_interval_hours = 6
global_max_drawdown_pct = 5.0
morning_huddle_utc = "06:00"

[broker]
paper_trading = true

[exits]
take_profit_pct = 5.0
stop_loss_pct = 3.0
trailing_stop_activation_pct = 2.0
trailing_stop_distance_pct = 1.0
stagnation_hours = 48
min_holding_minutes = 15

[data_sources]
fred_enabled = true
sec_edgar_enabled = true
sentiment_enabled = true
opensky_enabled = true
trafikverket_enabled = true
transcript_enabled = true

[brain]
enabled = true
schedule_utc = ["06:00", "12:00", "18:00", "00:00"]
acute_trigger_consecutive_losses = 3
acute_trigger_daily_drawdown_pct = 2.0
cooldown_hours = 1

[orchestrator.esg]
enabled = false
planetary_boundary_checks = false
min_esg_score = 40

[swarms]
max_concurrent_workers = 5
default_timeout_ms = 300000
backtest_timeout_ms = 900000

[pods.crypto]
enabled = true
adapter = "binance"
capital_pct = 60
strategy = "momentum_dip"
symbols = ["BTC/USDC", "ETH/USDC", "SOL/USDC"]
poll_interval_ms = 30000
risk_max_drawdown_pct = 3.0
risk_max_positions = 5

[pods.us_stocks]
enabled = true
adapter = "alpaca"
capital_pct = 40
strategy = "value_momentum"
symbols = ["AAPL", "MSFT", "NVDA", "TSLA", "AMZN", "GOOGL", "META"]
poll_interval_ms = 60000
risk_max_drawdown_pct = 2.0
risk_max_positions = 10
trading_hours = "09:30-16:00 ET"

[pods.eu_stocks]
enabled = false
adapter = "ibkr"
capital_pct = 0
strategy = "nordic_value"
symbols = ["HM-B.ST", "VOLV-B.ST"]
poll_interval_ms = 60000
risk_max_drawdown_pct = 2.0
risk_max_positions = 8
trading_hours = "09:00-17:30 CET"

[timing]
orchestrator_loop_ms = 60000
pod_default_loop_ms = 30000
state_publish_interval_ms = 10000
