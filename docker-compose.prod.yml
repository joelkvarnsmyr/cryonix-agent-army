services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: cryonix
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cryonix-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cryonix-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Python Engine (Market Scanner + Analysis)
  # ============================================================

  engine:
    build:
      context: ./packages/engine
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./cryonix.toml:/app/cryonix.toml:ro
      - ./scripts/strategy-lab:/app/scripts/strategy-lab:ro
    environment:
      - PYTHONUNBUFFERED=1
      - KV_URL=redis://redis:6379
      - NEXTJS_API_URL=http://web:3000
      - POSTGRES_URL=postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/cryonix
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_TESTNET=false
      - CRYONIX_ENV=production
      - TRADING_MODE=${TRADING_MODE:-margin}
      - MARGIN_TYPE=${MARGIN_TYPE:-cross}
      - DEFAULT_LEVERAGE=${DEFAULT_LEVERAGE:-3}
      - CMC_API_KEY=${CMC_API_KEY:-}
      - COINGLASS_API_KEY=${COINGLASS_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # Next.js Web App (Dashboard + API)
  # ============================================================

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./cryonix.toml:/app/cryonix.toml:ro
    environment:
      - NODE_ENV=production
      - CRYONIX_ENV=production
      - PORT=3000
      - KV_URL=redis://redis:6379
      - POSTGRES_URL=postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/cryonix
      - POSTGRES_PRISMA_URL=postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/cryonix
      - POSTGRES_URL_NON_POOLING=postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/cryonix
      - POSTGRES_USER=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DATABASE=cryonix
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_TESTNET=false
      - XAI_API_KEY=${XAI_API_KEY}
      - TRADING_MODE=${TRADING_MODE:-margin}
      - MARGIN_TYPE=${MARGIN_TYPE:-cross}
      - DEFAULT_LEVERAGE=${DEFAULT_LEVERAGE:-3}
      - ENABLE_AUTO_TRADING=true
      - ENGINE_URL=http://engine:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:${WEB_PORT:-3000}
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # Auto-Trader (Background polling loop)
  # ============================================================

  auto-trader:
    build:
      context: .
      dockerfile: Dockerfile.scripts
    restart: always
    command: [ "node", "scripts/services/auto-trader.mjs" ]
    volumes:
      - ./cryonix.toml:/app/cryonix.toml:ro
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://web:3000
    networks:
      - cryonix-net
    depends_on:
      - web

  # ============================================================
  # WebSocket Server (Real-time dashboard updates)
  # ============================================================

  ws-server:
    build:
      context: .
      dockerfile: Dockerfile.scripts
    restart: always
    command: [ "node", "scripts/services/ws-server.mjs" ]
    volumes:
      - ./cryonix.toml:/app/cryonix.toml:ro
    ports:
      - "${WS_PORT:-3004}:3004"
    environment:
      - NODE_ENV=production
      - KV_URL=redis://redis:6379
      - WS_PORT=3004
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.scripts
    restart: always
    command: [ "node", "scripts/services/telegram-interactive.mjs" ]
    volumes:
      - ./cryonix.toml:/app/cryonix.toml:ro
    environment:
      - NODE_ENV=production
      - TELEGRAM_INTERACTIVE_BOT_TOKEN=${TELEGRAM_INTERACTIVE_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_SIGNAL_CHANNEL_ID=${TELEGRAM_SIGNAL_CHANNEL_ID:-}
      - DISCORD_SIGNAL_WEBHOOK_URL=${DISCORD_SIGNAL_WEBHOOK_URL:-}
      - POSTGRES_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/cryonix
      - KV_URL=redis://redis:6379
      - NEXTJS_API_URL=http://web:3000
    networks:
      - cryonix-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # Telegram Signal Scraper (Python/Telethon)
  # ============================================================

  telegram-scraper:
    build:
      context: ./scripts/telegram-scraper
      dockerfile: Dockerfile
    restart: always
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION=${TELEGRAM_SESSION}
      - TELEGRAM_CHANNELS=${TELEGRAM_CHANNELS:-coincodecap,BinanceKillers,WolfOfTrading,WallStreetQueenOfficial}
      - KV_URL=redis://redis:6379
      - POSTGRES_URL=postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/cryonix
      - XAI_API_KEY=${XAI_API_KEY:-}
      - CONFIDENCE_BOOST_ENABLED=false
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ============================================================
  # Aktienix — US Stock Trading Agent
  # ============================================================

  aktienix:
    container_name: aktienix   # required — brain uses `docker restart aktienix`
    build:
      context: .
      dockerfile: Dockerfile.aktienix
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/services/aktienix-runner.ts"]
    volumes:
      - ./aktienix.toml:/app/aktienix.toml:ro
    environment:
      - NODE_ENV=production
      - KV_URL=redis://redis:6379
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_API_SECRET=${ALPACA_PAPER_API_SECRET}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  # ============================================================
  # AktienixBrain — Claude Code CLI autonomous portfolio analyst
  # ============================================================

  aktienix-brain:
    container_name: aktienix-brain
    build:
      context: .
      dockerfile: Dockerfile.aktienix
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/services/aktienix-brain.ts"]
    volumes:
      - ./aktienix.toml:/app/aktienix.toml  # read-write (Brain edits config)
      - /var/run/docker.sock:/var/run/docker.sock  # for docker restart aktienix
      - ~/.claude:/root/.claude:ro  # Claude Code auth (account login, not API key)
    environment:
      - NODE_ENV=production
      - KV_URL=redis://redis:6379
      - POSTGRES_URL=postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/cryonix
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_INTERACTIVE_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_API_SECRET=${ALPACA_PAPER_API_SECRET}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - PROJECT_ROOT=/app
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ============================================================
  # ============================================================
  # Polymarket Scanner (Prediction market intelligence)
  # ============================================================

  polymarket-scanner:
    build:
      context: .
      dockerfile: Dockerfile.polymarket
    restart: always
    environment:
      - KV_URL=redis://redis:6379
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================
  # Copynix — Solana Copy Trading Agent
  # ============================================================

  copynix:
    build:
      context: .
      dockerfile: Dockerfile.copynix
    restart: unless-stopped
    volumes:
      - ./copynix.toml:/app/copynix.toml:ro
    environment:
      - NODE_ENV=production
      - KV_URL=redis://redis:6379
      - HELIUS_API_KEY=${HELIUS_API_KEY:-}
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================
  # Polynix — Polymarket Binary Options Agent
  # ============================================================

  polynix:
    build:
      context: .
      dockerfile: Dockerfile.polynix
    container_name: polynix
    restart: unless-stopped
    env_file: .env
    environment:
      - KV_URL=redis://redis:6379
      - POSTGRES_URL=postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/cryonix
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================
  # Solanix — Solana DEX Trading Agent
  # ============================================================

  solanix:
    build:
      context: .
      dockerfile: Dockerfile.solanix
    container_name: solanix
    restart: unless-stopped
    volumes:
      - ./solanix.toml:/app/solanix.toml:ro
    environment:
      - NODE_ENV=production
      - KV_URL=redis://redis:6379
      - HELIUS_API_KEY=${HELIUS_API_KEY:-}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-}
      - SOLANA_PRIVATE_KEY=${SOLANA_PRIVATE_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    networks:
      - cryonix-net
    depends_on:
      redis:
        condition: service_healthy

  # Caddy Reverse Proxy (Handles HTTPS and routing)
  # ============================================================

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - cryonix-net
    depends_on:
      - web
      - ws-server

volumes:
  postgres_data:
  redis_data:
  caddy_data:


networks:
  cryonix-net:
    driver: bridge
